schema_version: 1
experiment_id: dynamics_uturn_dx0_focus_v1
target: dynamics

# P is the probability measure being evaluated.  It does not change when Q
# changes.  The ODE configuration below is also fixed for both runs.
target_measure:
  id: uturn_uniform_input_p_v1
  definition:
    model_id: uturn
    case_kind: uturn
    execution:
      solver_kind: ode
      jama_profile: ai_aeb
      controller_kind: jama_ai_aeb
      alignment_mode: uturn_trigger_aligned
    parameters:
      dx0:       {distribution: uniform, min: 10.0, max: 25.0}
      ego_speed: {distribution: uniform, min: 30.0, max: 40.0}
      npc_speed: {distribution: uniform, min: 10.0, max: 25.0}

# Q is manually selected.  Only dx0 is focused initially.  The 70% P component
# keeps Q positive everywhere P is positive, making P/Q exactly calculable.
proposal:
  id: uturn_dx0_focus_q1
  mode: manual_proposal
  definition:
    parameters:
      dx0:
        distribution: mixture_uniform_focus
        base_weight: 0.70
        focus: {min: 10.0, max: 14.0}
      ego_speed: {distribution: uniform, min: 30.0, max: 40.0}
      npc_speed: {distribution: uniform, min: 10.0, max: 25.0}
